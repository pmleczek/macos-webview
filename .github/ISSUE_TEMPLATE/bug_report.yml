name: Bug report
description: Report something that doesn't work as expected
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search the existing issues first to check that it hasn't been reported yet.

        Do not report security vulnerabilities here. Follow the [security policy](https://github.com/pmleczek/macos-webview/security/policy) instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The minimal steps needed to reproduce the bug. A link to a minimal repository is even better.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Include error messages and logs, and screenshots or videos for visual issues.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: macos-webview version
      description: The version or commit you're using.
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.0
    validations:
      required: true

  - type: input
    id: xcode-version
    attributes:
      label: Xcode version
      placeholder: e.g. Xcode 26.0

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might help, for example your Node.js and pnpm versions or the frontend framework you use.
