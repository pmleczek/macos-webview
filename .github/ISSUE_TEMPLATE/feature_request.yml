name: Feature request
description: Suggest a new feature or an improvement
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please check the [roadmap](https://github.com/pmleczek/macos-webview/blob/main/ROADMAP.md) and the existing issues first, in case it's already planned or requested.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The problem this feature would solve, or the use case it would enable.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Include an example of the API or the behavior, if you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you've considered, for example how other frameworks handle it.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might help, for example links, screenshots or mockups.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this feature myself
