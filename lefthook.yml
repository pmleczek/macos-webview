# yaml-language-server: $schema=./node_modules/lefthook/schema.json
min_version: 2.1.0
assert_lefthook_installed: true

pre-commit:
  piped: true
  jobs:
    - name: format
      glob: '*.{js,jsx,ts,tsx,md,mdx,mjs,yml,yaml,css,json,jsonc}'
      exclude:
        - 'pnpm-lock.yaml'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern --write {staged_files}
      stage_fixed: true
    - name: swift-format
      glob: '*.swift'
      run: swift-format format --in-place --parallel {staged_files}
      stage_fixed: true
    - name: swift-format-lint
      glob: '*.swift'
      run: swift-format lint --strict --parallel {staged_files}
    - name: swiftlint
      glob: '*.swift'
      run: swiftlint lint --quiet --force-exclude {staged_files}
    - name: lint
      glob: '*.{js,jsx,mjs,cjs,ts,tsx}'
      run: pnpm exec oxlint --no-error-on-unmatched-pattern {staged_files}
    - name: typecheck
      glob: '*.{ts,tsx}'
      run: pnpm run typecheck
    - name: knip
      glob: '*.{js,mjs,cjs,ts,tsx,json,jsonc,yaml}'
      run: pnpm exec knip
    - name: sherif
      glob: '{package.json,**/package.json,pnpm-workspace.yaml}'
      run: pnpm exec sherif --fail-on-warnings

pre-push:
  jobs:
    - name: branch-name
      run: bash scripts/branch-name.sh
      use_stdin: true
